<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin — Shaheedi Bunga Dodgeball</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: system-ui, sans-serif; background: #f4f4f8; color: #1a1a1a; }
header { background: #1a1a4e; color: white; padding: 16px 20px; display: flex; align-items: center; justify-content: space-between; }
header h1 { font-size: 18px; font-weight: 600; }
header p { font-size: 12px; opacity: 0.7; margin-top: 2px; }
.khanda { font-size: 28px; }
.container { max-width: 680px; margin: 24px auto; padding: 0 16px; }
.card { background: white; border-radius: 10px; padding: 22px; box-shadow: 0 1px 4px rgba(0,0,0,0.08); margin-bottom: 20px; }
.card h2 { font-size: 15px; font-weight: 700; color: #1a1a4e; margin-bottom: 14px; padding-bottom: 10px; border-bottom: 1px solid #f0f0f0; display: flex; align-items: center; justify-content: space-between; }
label { display: block; font-size: 13px; color: #555; margin-bottom: 4px; margin-top: 10px; }
input, select { width: 100%; padding: 8px 11px; border: 1px solid #ddd; border-radius: 6px; font-size: 13px; color: #1a1a1a; background: white; }
input:focus, select:focus { outline: none; border-color: #1a1a4e; }
.btn { display: inline-flex; align-items: center; gap: 5px; padding: 8px 16px; border-radius: 6px; font-size: 13px; font-weight: 600; cursor: pointer; border: none; margin-top: 12px; }
.btn-primary { background: #1a1a4e; color: white; width: 100%; justify-content: center; }
.btn-primary:hover { background: #2a2a6e; }
.btn-save { background: #15803d; color: white; padding: 5px 12px; margin-top: 0; font-size: 12px; border-radius: 5px; cursor: pointer; border: none; font-weight: 600; }
.btn-delete { background: #fee2e2; color: #dc2626; padding: 5px 10px; margin-top: 0; font-size: 12px; border-radius: 5px; cursor: pointer; border: none; font-weight: 600; }
.btn-delete:hover { background: #dc2626; color: white; }
.btn-edit { background: #dbeafe; color: #1d4ed8; padding: 5px 10px; margin-top: 0; font-size: 12px; border-radius: 5px; cursor: pointer; border: none; font-weight: 600; }
.msg { padding: 9px 13px; border-radius: 6px; font-size: 13px; margin-top: 10px; }
.msg-ok { background: #dcfce7; color: #15803d; }
.msg-err { background: #fee2e2; color: #dc2626; }
.hidden { display: none; }
.logout-btn { background: none; border: 1px solid rgba(255,255,255,0.4); color: white; padding: 5px 13px; border-radius: 5px; cursor: pointer; font-size: 13px; }
.two-col { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.three-col { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; }

/* Teams table */
.teams-table { width: 100%; border-collapse: collapse; font-size: 13px; }
.teams-table td { padding: 9px 8px; border-bottom: 1px solid #f0f0f0; vertical-align: middle; }
.teams-table tr:last-child td { border-bottom: none; }
.teams-table .name-cell { font-weight: 600; }
.teams-table .type-cell { color: #888; font-size: 12px; }
.teams-table .actions-cell { text-align: right; display: flex; gap: 6px; justify-content: flex-end; }
.edit-name-input { width: 140px; padding: 4px 8px; font-size: 13px; border: 1px solid #1a1a4e; border-radius: 4px; }

/* Matches table */
.match-row { padding: 12px 0; border-bottom: 1px solid #f0f0f0; }
.match-row:last-child { border-bottom: none; }
.match-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; }
.match-title { font-size: 13px; font-weight: 700; }
.match-time-label { font-size: 11px; color: #888; }
.score-row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.score-input { width: 56px; padding: 6px 8px; border: 1px solid #ddd; border-radius: 5px; text-align: center; font-size: 16px; font-weight: 700; color: #1a1a4e; }
.vs-label { color: #888; font-size: 13px; font-weight: 600; }
.status-select { font-size: 12px; padding: 6px 8px; border: 1px solid #ddd; border-radius: 5px; width: auto; }
.match-actions { display: flex; gap: 6px; margin-left: auto; }
</style>
</head>
<body>
<header>
  <div>
    <h1>Shaheedi Bunga UK - Admin</h1>
    <p id="admin-email">Score management</p>
  </div>
  <div style="display:flex;align-items:center;gap:12px">
    <span class="khanda">☬</span>
    <button class="logout-btn hidden" id="logout-btn" onclick="logout()">Log out</button>
  </div>
</header>

<div class="container">

  <!-- LOGIN -->
  <div id="login-panel" class="card">
    <h2>Admin Login</h2>
    <label>Email</label>
    <input type="email" id="login-email" placeholder="your@email.com">
    <label>Password</label>
    <input type="password" id="login-pass" placeholder="Password" onkeydown="if(event.key==='Enter')login()">
    <button class="btn btn-primary" onclick="login()">Log in</button>
    <div id="login-msg"></div>
  </div>

  <!-- ADMIN -->
  <div id="admin-panel" class="hidden">

    <!-- TEAMS -->
    <div class="card">
      <h2>Teams <span style="font-size:12px;color:#888;font-weight:400" id="team-count"></span></h2>
      <div id="teams-list"></div>
      <div style="margin-top:16px;padding-top:14px;border-top:1px solid #f0f0f0">
        <div style="font-size:13px;font-weight:600;color:#1a1a4e;margin-bottom:8px">Add new team</div>
        <div class="two-col">
          <div>
            <label>Team name</label>
            <input type="text" id="new-team-name" placeholder="e.g. Khalsa Warriors">
          </div>
          <div>
            <label>School type</label>
            <select id="new-team-type">
              <option value="Primary">Primary</option>
              <option value="Secondary">Secondary</option>
            </select>
          </div>
        </div>
        <button class="btn btn-primary" onclick="addTeam()">+ Add Team</button>
        <div id="team-msg"></div>
      </div>
    </div>

    <!-- MATCHES -->
    <div class="card">
      <h2>Matches <span style="font-size:12px;color:#888;font-weight:400" id="match-count"></span></h2>
      <div id="matches-list"></div>
      <div style="margin-top:16px;padding-top:14px;border-top:1px solid #f0f0f0">
        <div style="font-size:13px;font-weight:600;color:#1a1a4e;margin-bottom:8px">Add new match</div>
        <div class="two-col">
          <div>
            <label>Home team</label>
            <select id="new-home"></select>
          </div>
          <div>
            <label>Away team</label>
            <select id="new-away"></select>
          </div>
        </div>
        <label>Match date & time</label>
        <input type="datetime-local" id="new-time">
        <button class="btn btn-primary" onclick="addMatch()">+ Add Match</button>
        <div id="match-msg"></div>
      </div>
    </div>

    <div style="text-align:center;padding-bottom:30px">
      <a href="index.html" style="font-size:13px;color:#888;text-decoration:none">← Back to public scoreboard</a>
    </div>
  </div>
</div>

<script>
const URL = 'https://pxveryjqpxczzfnhnyci.supabase.co';
const ANON = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InB4dmVyeWpxcHhjenpmbmhueWNpIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzk2OTg2MTEsImV4cCI6MjA5NTI3NDYxMX0.6iPO_cmgeFTeiI9aPYljv2yqt63PYNFEw67cs7NffEU';
let TOKEN = '';

async function api(path, method='GET', body=null) {
  const headers = { 'apikey': ANON, 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + (TOKEN||ANON) };
  if (method !== 'GET') headers['Prefer'] = 'return=representation';
  const r = await fetch(URL + '/rest/v1/' + path, { method, headers, body: body ? JSON.stringify(body) : null });
  if (r.status === 204 || r.status === 200 && method === 'DELETE') return {};
  return r.json();
}

async function authApi(ep, body) {
  const r = await fetch(URL + '/auth/v1/' + ep, { method:'POST', headers:{'apikey':ANON,'Content-Type':'application/json'}, body:JSON.stringify(body) });
  return r.json();
}

async function login() {
  const email = document.getElementById('login-email').value.trim();
  const pass = document.getElementById('login-pass').value;
  const msg = document.getElementById('login-msg');
  msg.innerHTML = '<div class="msg">Logging in...</div>';
  const d = await authApi('token?grant_type=password', {email, password:pass});
  if (d.access_token) {
    TOKEN = d.access_token;
    document.getElementById('login-panel').classList.add('hidden');
    document.getElementById('admin-panel').classList.remove('hidden');
    document.getElementById('logout-btn').classList.remove('hidden');
    document.getElementById('admin-email').textContent = email;
    loadAll();
  } else {
    msg.innerHTML = '<div class="msg msg-err">Login failed — check email and password.</div>';
  }
}

function logout() {
  TOKEN = '';
  document.getElementById('login-panel').classList.remove('hidden');
  document.getElementById('admin-panel').classList.add('hidden');
  document.getElementById('logout-btn').classList.add('hidden');
  document.getElementById('login-email').value='';
  document.getElementById('login-pass').value='';
  document.getElementById('admin-email').textContent='Score management';
}

async function loadAll() { await loadTeams(); await loadMatches(); }

let teamsCache = [];

async function loadTeams() {
  teamsCache = await api('teams?select=*&order=name');
  document.getElementById('team-count').textContent = teamsCache.length + ' teams';
  const el = document.getElementById('teams-list');
  if (!teamsCache.length) { el.innerHTML = '<div style="color:#888;font-size:13px;padding:8px 0">No teams yet.</div>'; return; }
  el.innerHTML = '<table class="teams-table"><thead><tr><td style="color:#888;font-size:11px;font-weight:600;padding-bottom:6px">NAME</td><td style="color:#888;font-size:11px;font-weight:600">TYPE</td><td></td></tr></thead><tbody>' +
    teamsCache.map(t => `
      <tr id="team-row-${t.id}">
        <td class="name-cell" id="team-name-${t.id}">${t.name}</td>
        <td class="type-cell">
          <select style="width:auto;padding:3px 6px;font-size:12px" id="team-type-${t.id}" onchange="saveTeamType('${t.id}')">
            <option value="Primary" ${t.school_type==='Primary'?'selected':''}>Primary</option>
            <option value="Secondary" ${t.school_type==='Secondary'?'selected':''}>Secondary</option>
          </select>
        </td>
        <td class="actions-cell">
          <button class="btn-edit" onclick="editTeamName('${t.id}','${t.name}')">Rename</button>
          <button class="btn-delete" onclick="deleteTeam('${t.id}','${t.name}')">Delete</button>
        </td>
      </tr>`).join('') +
    '</tbody></table>';
  ['new-home','new-away'].forEach(id => {
    document.getElementById(id).innerHTML = teamsCache.map(t => `<option value="${t.id}">${t.name} (${t.school_type})</option>`).join('');
  });
}

function editTeamName(id, currentName) {
  const cell = document.getElementById('team-name-'+id);
  cell.innerHTML = `<input class="edit-name-input" id="edit-input-${id}" value="${currentName}"> <button class="btn-save" onclick="saveTeamName('${id}')">Save</button>`;
  document.getElementById('edit-input-'+id).focus();
}

async function saveTeamName(id) {
  const name = document.getElementById('edit-input-'+id).value.trim();
  if (!name) return;
  await api('teams?id=eq.'+id, 'PATCH', {name});
  await loadTeams();
  await loadMatches();
}

async function saveTeamType(id) {
  const type = document.getElementById('team-type-'+id).value;
  await api('teams?id=eq.'+id, 'PATCH', {school_type: type});
}

async function deleteTeam(id, name) {
  if (!confirm(`Delete "${name}"? This will also delete all their matches.`)) return;
  await api('matches?or=(home_team_id.eq.'+id+',away_team_id.eq.'+id+')', 'DELETE');
  await api('teams?id=eq.'+id, 'DELETE');
  await loadAll();
}

async function addTeam() {
  const name = document.getElementById('new-team-name').value.trim();
  const type = document.getElementById('new-team-type').value;
  const msg = document.getElementById('team-msg');
  if (!name) { msg.innerHTML = '<div class="msg msg-err">Please enter a team name.</div>'; return; }
  await api('teams', 'POST', {name, school_type:type});
  document.getElementById('new-team-name').value = '';
  msg.innerHTML = '<div class="msg msg-ok">✓ Team added!</div>';
  setTimeout(()=>msg.innerHTML='',3000);
  await loadTeams();
}

async function loadMatches() {
  const matches = await api('matches?select=*,home:home_team_id(name),away:away_team_id(name)&order=match_time');
  document.getElementById('match-count').textContent = matches.length + ' matches';
  const el = document.getElementById('matches-list');
  if (!matches.length) { el.innerHTML = '<div style="color:#888;font-size:13px;padding:8px 0">No matches yet.</div>'; return; }
  el.innerHTML = matches.map(m => {
    const dt = m.match_time ? new Date(m.match_time).toLocaleString('en-GB',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'}) : 'No time set';
    return `
    <div class="match-row" id="match-row-${m.id}">
      <div class="match-header">
        <div>
          <div class="match-title">${m.home?.name||'?'} vs ${m.away?.name||'?'}</div>
          <div style="font-size:11px;color:#999;margin-top:2px">${m.home?.school_type||''} vs ${m.away?.school_type||''}</div>
          <div class="match-time-label">${dt}</div>
        </div>
        <button class="btn-delete" onclick="deleteMatch('${m.id}')">Delete</button>
      </div>
      <div class="score-row">
        <span style="font-size:12px;color:#555;min-width:80px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${m.home?.name||'?'}</span>
        <input class="score-input" type="number" min="0" id="hs-${m.id}" value="${m.home_score}">
        <span class="vs-label">–</span>
        <input class="score-input" type="number" min="0" id="as-${m.id}" value="${m.away_score}">
        <span style="font-size:12px;color:#555;min-width:80px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${m.away?.name||'?'}</span>
        <select class="status-select" id="st-${m.id}">
          <option value="upcoming" ${m.status==='upcoming'?'selected':''}>Upcoming</option>
          <option value="live" ${m.status==='live'?'selected':''}>Live</option>
          <option value="completed" ${m.status==='completed'?'selected':''}>Full time</option>
        </select>
        <button class="btn-save" onclick="saveMatch('${m.id}')" id="save-btn-${m.id}">Save</button>
      </div>
    </div>`;
  }).join('');
}

async function saveMatch(id) {
  const hs = parseInt(document.getElementById('hs-'+id).value)||0;
  const as = parseInt(document.getElementById('as-'+id).value)||0;
  const st = document.getElementById('st-'+id).value;
  await api('matches?id=eq.'+id, 'PATCH', {home_score:hs, away_score:as, status:st});
  const btn = document.getElementById('save-btn-'+id);
  btn.textContent='✓ Saved'; btn.style.background='#0f6e56';
  setTimeout(()=>{btn.textContent='Save';btn.style.background='';},2000);
}

async function deleteMatch(id) {
  if (!confirm('Delete this match?')) return;
  await api('matches?id=eq.'+id, 'DELETE');
  await loadMatches();
}

async function addMatch() {
  const home = document.getElementById('new-home').value;
  const away = document.getElementById('new-away').value;
  const time = document.getElementById('new-time').value;
  const msg = document.getElementById('match-msg');
  if (home===away) { msg.innerHTML='<div class="msg msg-err">Home and away teams must be different.</div>'; return; }
  await api('matches','POST',{home_team_id:home, away_team_id:away, match_time:time||null, status:'upcoming', home_score:0, away_score:0});
  document.getElementById('new-time').value='';
  msg.innerHTML='<div class="msg msg-ok">✓ Match added!</div>';
  setTimeout(()=>msg.innerHTML='',3000);
  await loadMatches();
}
</script>
</body>
</html>
