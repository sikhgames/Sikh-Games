<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Shaheedi Bunga Dodgeball</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: system-ui, sans-serif; background: #f4f4f8; color: #1a1a1a; }
header { background: #1a1a4e; color: white; padding: 16px 20px; display: flex; align-items: center; justify-content: space-between; }
header h1 { font-size: 18px; font-weight: 600; }
header p { font-size: 12px; opacity: 0.7; margin-top: 2px; }
.khanda { font-size: 28px; }
.tabs { display: flex; background: white; border-bottom: 2px solid #e5e5e5; position: sticky; top: 0; z-index: 10; }
.tab { padding: 12px 28px; font-size: 14px; cursor: pointer; border: none; background: none; color: #666; border-bottom: 3px solid transparent; margin-bottom: -2px; font-weight: 500; }
.tab.active { color: #1a1a4e; border-bottom-color: #c8960c; font-weight: 700; }
.container { max-width: 720px; margin: 20px auto; padding: 0 16px; }

/* Standings */
table { width: 100%; border-collapse: collapse; background: white; border-radius: 10px; overflow: hidden; box-shadow: 0 1px 4px rgba(0,0,0,0.08); }
thead tr { background: #1a1a4e; }
th { color: white; padding: 10px 10px; text-align: center; font-size: 11px; letter-spacing: 0.6px; text-transform: uppercase; }
th.left { text-align: left; }
td { padding: 11px 10px; text-align: center; border-bottom: 1px solid #f0f0f0; font-size: 14px; }
td.left { text-align: left; }
tr:last-child td { border-bottom: none; }
tr:hover td { background: #fafafa; }
.rank { color: #aaa; font-size: 12px; width: 26px; }
.team-name { font-weight: 700; font-size: 14px; }
.team-type { font-size: 11px; color: #999; margin-top: 1px; }
.pts { font-weight: 800; color: #1a1a4e; font-size: 16px; }
.w { color: #15803d; font-weight: 700; }
.l { color: #dc2626; }
.d { color: #888; }
.top-row td { background: rgba(200,150,12,0.06); }

/* Fixtures */
.fixture-group-label { font-size: 11px; color: #888; font-weight: 700; text-transform: uppercase; letter-spacing: 0.6px; margin: 18px 0 8px; }
.fixture-card { background: white; border-radius: 10px; margin-bottom: 8px; box-shadow: 0 1px 4px rgba(0,0,0,0.07); overflow: hidden; }
.fixture-inner { display: flex; align-items: stretch; }
.fixture-time-col { background: #1a1a4e; color: white; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 12px 14px; min-width: 72px; }
.fixture-time-col .time { font-size: 15px; font-weight: 700; }
.fixture-time-col .date-short { font-size: 10px; opacity: 0.7; margin-top: 2px; }
.fixture-body { flex: 1; display: flex; align-items: center; padding: 10px 14px; gap: 8px; }
.fixture-team { font-size: 13px; font-weight: 700; flex: 1; }
.fixture-team.right { text-align: right; }
.fixture-score { font-size: 18px; font-weight: 800; color: #1a1a4e; min-width: 64px; text-align: center; }
.fixture-score.upcoming { font-size: 13px; color: #aaa; font-weight: 500; }
.fixture-badge-col { display: flex; align-items: center; padding: 10px 12px 10px 0; }
.badge { font-size: 10px; padding: 3px 9px; border-radius: 20px; font-weight: 700; white-space: nowrap; }
.badge-live { background: #fee2e2; color: #dc2626; animation: pulse 1.5s infinite; }
.badge-done { background: #f0f0f0; color: #666; }
.badge-soon { background: #dbeafe; color: #1d4ed8; }
@keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.6} }

.loading { text-align: center; padding: 40px; color: #aaa; font-size: 14px; }
.admin-link { text-align: center; margin-top: 20px; padding-bottom: 28px; }
.admin-link a { font-size: 12px; color: #bbb; text-decoration: none; }
.admin-link a:hover { color: #1a1a4e; }
.refresh-note { text-align: center; font-size: 11px; color: #ccc; margin-top: 10px; }
</style>
</head>
<body>

<header>
  <div>
    <h1>Shaheedi Bunga UK — Dodgeball</h1>
    <p>Tournament Scoreboard</p>
  </div>
  <span class="khanda">☬</span>
</header>

<div class="tabs">
  <button class="tab active" onclick="showTab('standings',this)">Standings</button>
  <button class="tab" onclick="showTab('fixtures',this)">Fixtures & Results</button>
</div>

<div class="container">
  <div id="standings"><div class="loading">Loading standings...</div></div>
  <div id="fixtures" style="display:none"><div class="loading">Loading fixtures...</div></div>
  <div class="refresh-note" id="last-updated"></div>
  <div class="admin-link"><a href="admin.html">Admin login</a></div>
</div>

<script>
const SUPABASE_URL = 'https://pxveryjqpxczzfnhnyci.supabase.co';
const ANON = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InB4dmVyeWpxcHhjenpmbmhueWNpIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzk2OTg2MTEsImV4cCI6MjA5NTI3NDYxMX0.6iPO_cmgeFTeiI9aPYljv2yqt63PYNFEw67cs7NffEU';

async function api(path) {
  const r = await fetch(SUPABASE_URL + '/rest/v1/' + path, {
    headers: { 'apikey': ANON, 'Authorization': 'Bearer ' + ANON }
  });
  return r.json();
}

let currentTab = 'standings';

function showTab(id, el) {
  currentTab = id;
  document.getElementById('standings').style.display = id === 'standings' ? 'block' : 'none';
  document.getElementById('fixtures').style.display = id === 'fixtures' ? 'block' : 'none';
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  el.classList.add('active');
}

async function loadAll() {
  const [teams, matches] = await Promise.all([
    api('teams?select=*&order=name'),
    api('matches?select=*,home:home_team_id(name),away:away_team_id(name)&order=match_time')
  ]);
  renderStandings(teams, matches);
  renderFixtures(matches);
  const now = new Date();
  document.getElementById('last-updated').textContent =
    'Last updated: ' + now.toLocaleTimeString('en-GB', {hour:'2-digit',minute:'2-digit',second:'2-digit'});
}

function renderStandings(teams, matches) {
  // Build stats — W=3pts, D=1pt, L=0pts, auto-calculated from scores
  const stats = {};
  teams.forEach(t => stats[t.id] = { name: t.name, type: t.school_type, p:0, w:0, d:0, l:0, pts:0, gf:0, ga:0 });

  matches.forEach(m => {
    if (m.status !== 'completed') return;
    const h = stats[m.home_team_id];
    const a = stats[m.away_team_id];
    if (!h || !a) return;
    h.p++; a.p++;
    h.gf += m.home_score; h.ga += m.away_score;
    a.gf += m.away_score; a.ga += m.home_score;
    if (m.home_score > m.away_score) {
      h.w++; h.pts += 3; a.l++;
    } else if (m.home_score < m.away_score) {
      a.w++; a.pts += 3; h.l++;
    } else {
      h.d++; h.pts += 1; a.d++; a.pts += 1;
    }
  });

  const sorted = Object.values(stats).sort((a, b) =>
    b.pts - a.pts || b.w - a.w || (b.gf - b.ga) - (a.gf - a.ga)
  );

  document.getElementById('standings').innerHTML =
    '<table><thead><tr>' +
    '<th class="left" colspan="2">Team</th>' +
    '<th title="Played">P</th>' +
    '<th title="Won">W</th>' +
    '<th title="Drawn">D</th>' +
    '<th title="Lost">L</th>' +
    '<th title="Goals For">GF</th>' +
    '<th title="Goals Against">GA</th>' +
    '<th title="Points">Pts</th>' +
    '</tr></thead><tbody>' +
    sorted.map((t, i) => `
      <tr class="${i === 0 && t.p > 0 ? 'top-row' : ''}">
        <td class="rank">${i + 1}</td>
        <td class="left">
          <div class="team-name">${t.name}</div>
          <div class="team-type">${t.type || ''}</div>
        </td>
        <td>${t.p}</td>
        <td class="w">${t.w}</td>
        <td class="d">${t.d}</td>
        <td class="l">${t.l}</td>
        <td>${t.gf}</td>
        <td>${t.ga}</td>
        <td class="pts">${t.pts}</td>
      </tr>`).join('') +
    '</tbody></table>';
}

function renderFixtures(matches) {
  if (!matches.length) {
    document.getElementById('fixtures').innerHTML = '<div class="loading">No fixtures yet.</div>';
    return;
  }

  let html = '';
  let lastDate = '';

  matches.forEach(m => {
    const dt = m.match_time ? new Date(m.match_time) : null;
    const dateKey = dt
      ? dt.toLocaleDateString('en-GB', { weekday:'long', day:'numeric', month:'long', year:'numeric' })
      : 'Date TBC';
    const timeStr = dt
      ? dt.toLocaleTimeString('en-GB', { hour:'2-digit', minute:'2-digit' })
      : 'TBC';
    const dateShort = dt
      ? dt.toLocaleDateString('en-GB', { day:'numeric', month:'short' })
      : '';

    if (dateKey !== lastDate) {
      html += `<div class="fixture-group-label">${dateKey}</div>`;
      lastDate = dateKey;
    }

    const badge = m.status === 'live'
      ? '<span class="badge badge-live">● Live</span>'
      : m.status === 'completed'
        ? '<span class="badge badge-done">Full time</span>'
        : '<span class="badge badge-soon">Upcoming</span>';

    const scoreOrVs = m.status === 'upcoming'
      ? '<span class="fixture-score upcoming">vs</span>'
      : `<span class="fixture-score">${m.home_score} – ${m.away_score}</span>`;

    html += `
      <div class="fixture-card">
        <div class="fixture-inner">
          <div class="fixture-time-col">
            <span class="time">${timeStr}</span>
            <span class="date-short">${dateShort}</span>
          </div>
          <div class="fixture-body">
            <span class="fixture-team">${m.home?.name || 'TBC'}</span>
            ${scoreOrVs}
            <span class="fixture-team right">${m.away?.name || 'TBC'}</span>
          </div>
          <div class="fixture-badge-col">${badge}</div>
        </div>
      </div>`;
  });

  document.getElementById('fixtures').innerHTML = html;
}

// Initial load then auto-refresh every 30 seconds
loadAll();
setInterval(loadAll, 30000);
</script>
</body>
</html>
